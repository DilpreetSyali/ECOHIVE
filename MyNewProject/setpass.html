<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET PASSWORD</title>
    <style>
        /* General Styles */
        body, html {
            font-family: 'Arial', sans-serif;
            background-color: #f0f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em; /* Increased the font size of the title */
            color: #2f855a;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-group input {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #4caf50;
            outline: none;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.9em;
            display: none;
            margin-bottom: 10px;
        }

        .success-message {
            color: #38a169;
            font-size: 0.9em;
            display: none;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Set Password</h1>
        <div class="input-group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="Enter new password">
        </div>
        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
        </div>
        <p class="error-message" id="errorMessage">Passwords do not match. Please try again.</p>
        <p class="success-message" id="successMessage">Password set successfully!</p>
        <button class="btn" onclick="setPassword()">Set Password</button>
    </div>

    <script>
        function setPassword() {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");

            // Hide messages initially
            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            // Check if passwords match
            if (password === confirmPassword && password !== "") {
                // Show success message
                successMessage.style.display = "block";
                errorMessage.style.display = "none";
                // Simulate saving the password (e.g., send to server or store locally)
                console.log("Password set:", password);
            } else {
                // Show error message
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
            }
        }
    </script>

</body>
</html>
